[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsentry"
version = "1.0.0"
description = "Automated ML Model Monitoring & Drift Detection Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.110.0",
    "pydantic~=2.6.0",
    "pydantic-settings~=2.2.0",
    "uvicorn~=0.28.0",
    "sqlalchemy~=2.0.25",
    "alembic~=1.13.0",
    "psycopg2-binary~=2.9.0",
    "apscheduler~=3.10.0",
    "scipy~=1.12.0",
    "numpy~=1.26.0",
    "transformers~=4.38.0",
    "torch~=2.2.0",
    "requests~=2.31.0",
    "jinja2~=3.1.0",
    "mlflow-skinny~=2.11.0",
    "python-dotenv~=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0.2",
    "pytest-asyncio~=0.23.5",
    "pytest-mock~=3.12.0",
    "httpx~=0.27.0",
    "pip-tools~=7.4.0",
]
test = [
    "pytest~=8.0.2",
    "pytest-asyncio~=0.23.5",
    "pytest-mock~=3.12.0",
    "httpx~=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mlsentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
